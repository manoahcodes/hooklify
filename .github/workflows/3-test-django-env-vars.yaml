name: 3 - Test Django Envrionment Variables
on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django Tests
        working-directory: ./src
        env:
          DJANGO_DEBUG: 0
          DJANGO_SECRET_KEY: testing123
        run: |
          python manage.py test