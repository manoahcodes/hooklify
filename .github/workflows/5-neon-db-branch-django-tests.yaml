name: 5 - Branch Neon DB for Django Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 0
      # DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROD_BRANCH: "PRODUCTION"
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_GITHUB_BRANCH: "gh-delete"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11'
      - name: Setup Neon Database
        run: |
          npm install -g neonctl
      - name: Delete Neon Branch
        continue-on-error: true
        run: |
          neon branches delete "${{ secrets.NEON_GITHUB_BRANCH }}" --project-id "${{ secrets.NEON_PROJECT_ID }}"
      - name: Create Neon Branch
        run: |
          neon branches create "${{ secrets.NEON_GITHUB_BRANCH }}" --parent "${{ secrets.NEON_PROD_BRANCH }}" --project-id "${{ secrets.NEON_PROJECT_ID }}"
      - name: Database URL Env Val
        run: |
          CONN_STRING=$(neonctl connection-string --branch "${{ secrets.NEON_GITHUB_BRANCH }}" --project-id "${{ secrets.NEON_PROJECT_ID }}")
          echo "DATABASE_URL=$CONN_STRING" >> $GITHUB_ENV
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django Tests
        working-directory: ./src
        run: |
          python manage.py test
