name: 4 - Test Django Secret Database URL
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 0
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Django Secret Key
        run: |
          my_gena_key=$(openssl rand -base64 32)
          echo "DJANGO_SECRET_KEY=$my_gena_key" >> $GITHUB_ENV
      - name: Echo Database URL
        run: |
          echo ${{ secrets.NEON_DATABASE_URL }}
          echo $DATABASE_URL
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django Tests
        working-directory: ./src
        run: |
          python manage.py test
