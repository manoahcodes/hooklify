{% extends "base.html" %}
{% block head_title %}{{ block.super}} - Home{% endblock head_title %} 

{% block content %}

<h1>Enter the password</h1>
<form method="POST" action="{% url 'protected' %}">
    {% csrf_token %}
    <input type="password" name="code" placeholder="Enter the code" required>
    <button type="submit">Submit</button>
</form>

{% endblock content %}
